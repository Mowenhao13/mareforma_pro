[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mareforma-pro"
version = "0.4.1"
description = "Rootless, no-sudo observation transports for Mareforma"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mareforma", "provenance", "grounding", "rootless", "fuse", "strace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "mareforma>=0.4.0",
    "click>=8.1",
]

[project.optional-dependencies]
# Optional OTLP/HTTP transport. The built-in JSONL exporter and span
# projection use only the standard library.
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
# Editable development and tests for this distribution on its own.
dev = [
    "pytest>=9.0.3",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/mareforma/mareforma"
Documentation = "https://docs.mareforma.com"
Repository = "https://github.com/mareforma/mareforma"
Issues = "https://github.com/mareforma/mareforma/issues"

[project.scripts]
mareforma-pro = "mareforma_pro.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mareforma_pro", "mareforma_pro.*"]

[tool.setuptools.package-data]
mareforma_pro = ["py.typed"]
"mareforma_pro.autohook" = ["sitecustomize.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "rootless: requires strace, bwrap, /dev/fuse, or another host primitive",
]

[tool.coverage.run]
source = ["mareforma_pro"]
omit = ["tests/*"]
